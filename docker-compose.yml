services:
  api-cognitiva:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soc_backend_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./evaluation:/evaluation
      - model_cache:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - soc_network

  dashboard-soc:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://api-cognitiva:8000
    container_name: soc_frontend_dashboard
    ports:
      - "8501:8501"
    depends_on:
      - api-cognitiva
    networks:
      - soc_network

networks:
  soc_network:
    driver: bridge

volumes:
  model_cache:
