services:
  api-cognitiva:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soc_backend_api
    ports:
      - "8000:8000"
    volumes:
      # Montaje local para ver cambios de código en vivo (Hot Reload)
      - ./backend:/app
      - ./evaluation:/evaluation
      # Volumen persistente para no descargar los pesos de Hugging Face en cada reinicio

      - model_cache:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
    command: /app/entrypoint.sh
    networks:
      - soc_network

  dashboard-soc:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://api-cognitiva:8000
    container_name: soc_frontend_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - api-cognitiva
    networks:
      - soc_network

networks:
  soc_network:
    driver: bridge

volumes:
  model_cache: